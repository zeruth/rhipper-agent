# A release: on a `v*` tag, or by hand (which tags the current commit as `v0.2.<commits>`,
# the binary's own version), the workspace builds in release, the two binaries go into a zip
# with the README, the pairing skill and the capture script, Inno Setup makes an installer
# that puts them where `rc install` does (%LOCALAPPDATA%\Programs\rhipper, on the user's
# PATH), and the release carries the notes GitHub writes from the commits since the last tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: version
        id: version
        shell: pwsh
        run: |
          $commits = git rev-list --count HEAD
          $version = "0.2.$commits"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "release $version"

      - name: tag the commit (manual release)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Rhipper Agent ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@rhipper.local"

      - name: build
        run: cargo build --release --locked -p rc -p rc-gui

      - name: test
        run: cargo test --workspace --locked --no-fail-fast

      - name: bundle
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dir = "dist/rhipper-agent-$v-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/rc.exe, target/release/rc-gui.exe $dir
          Copy-Item README.md, scripts/shot-window.ps1 $dir
          New-Item -ItemType Directory -Force "$dir/skills/rhipper-pair" | Out-Null
          Copy-Item .claude/skills/rhipper-pair/SKILL.md "$dir/skills/rhipper-pair/"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/rhipper-agent-$v-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v /DBinDir="$PWD\target\release" /DOutDir="$PWD\dist" installer\rhipper.iss
          Get-ChildItem dist

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rhipper Agent ${{ steps.version.outputs.version }}
          # the notes: what changed since the last release, from the commits, written by GitHub
          generate_release_notes: true
          files: |
            dist/rhipper-agent-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/rhipper-agent-${{ steps.version.outputs.version }}-setup.exe
