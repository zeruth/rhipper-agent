# The project's agent settings, beside rhipper.md: `[[route]]` rules, the `[worker]` table and
# the `[role]` table. A key left out keeps the default.

[worker]
# No turn cap: a run goes on until it answers, resuming its session. A turn's cost scales with
# the context it carries, so a run restarts fresh on a handoff once a turn passes this many
# input tokens.
context = 160000
# One Fable worker (the person, 2026-11-12, new week): the agent's roadmap is pruned and
# regenerated around workflow execution, its efficiency and the model chosen per task, then
# walked one card at a time. A Fable walk sits outside the Opus pool.
parallel = 12
borrow = false
# the roadmap commands a regeneration card reshapes the roadmap with; in a worktree `rc` opens
# the project's roadmap. Not `rc set` (accepted lands a card) nor the walk's commands
allow = [
    "Bash(rc show*)",
    "Bash(rc check*)",
    "Bash(rc next*)",
    "Bash(rc history*)",
    "Bash(rc usage*)",
    "Bash(rc add *)",
    "Bash(rc edit *)",
    "Bash(rc remove *)",
    "Bash(rc move *)",
    "Bash(rc depend *)",
    "Bash(rc priority *)",
    "PowerShell(rc show*)",
    "PowerShell(rc check*)",
    "PowerShell(rc next*)",
    "PowerShell(rc history*)",
    "PowerShell(rc usage*)",
    "PowerShell(rc add *)",
    "PowerShell(rc edit *)",
    "PowerShell(rc remove *)",
    "PowerShell(rc move *)",
    "PowerShell(rc depend *)",
    "PowerShell(rc priority *)",
    "Bash(rc set * defined)",
    "Bash(rc set * blocked)",
    "Bash(rc set * cancelled)",
    "PowerShell(rc set * defined)",
    "PowerShell(rc set * blocked)",
    "PowerShell(rc set * cancelled)",
]

# The implementer of every card here is Fable; the reviewer and the cheap roles keep theirs.
[[route]]
model = "claude-opus-5-5"

[role]
# The model of each cheap role a run ends with. A key left out goes to the local server at
# RHIPPER_LOCAL_URL (default http://127.0.0.1:8080/v1) when it answers a ping, under
# `local/<the first model it lists>`, and to no model call at all when it does not; an empty
# string turns the role off whatever the server does. The calls land in `rc usage` under the
# role's model.
# summary = "local/qwen3-8b"     # the worker's report condensed for the handoff of the card
# digest = "local/qwen3-8b"      # the run's one-line digest for the other projects on the machine
# classify = "local/qwen3-8b"    # whether a look-back bullet without its tag is [machine]
