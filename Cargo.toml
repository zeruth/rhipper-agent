[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
ra-console = { path = "crates/ra-console" }
ra-context = { path = "crates/ra-context" }
ra-providers = { path = "crates/ra-providers" }
ra-gotchas = { path = "crates/ra-gotchas" }
ra-roadmap = { path = "crates/ra-roadmap" }
ra-tools = { path = "crates/ra-tools" }
ra-usage = { path = "crates/ra-usage" }

anyhow = "1.0.100"
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
clap = { version = "4.6", features = ["derive", "env"] }
ratatui = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
thiserror = "2"
tempfile = "3"
regex = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
