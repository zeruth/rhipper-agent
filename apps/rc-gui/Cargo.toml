[package]
name = "rc-gui"
description = "The Rhipper Agent workspace: an IntelliJ-style window over the roadmap and the workers, in the Blood Moon theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rc-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ra-console.workspace = true
ra-gotchas.workspace = true
ra-providers.workspace = true
ra-roadmap.workspace = true
ra-usage.workspace = true
tokio.workspace = true
tracing.workspace = true
