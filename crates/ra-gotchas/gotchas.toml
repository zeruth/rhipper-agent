# The gotchas: recurring, machine-dependent problems a worker run hits, and the local fix for
# each. Nothing here costs a model call. `rc gotchas` shows which ones fire; add an entry when
# the same denied command or error line keeps coming back.
#
# where:   command  — a shell command the worker is about to run
#          result   — the text a shell returned
#          edit     — what an edit tool answered
#          text     — the worker's own words between its tool calls
#          answer   — the worker's final report
# remedy:  hint     — the message goes to the worker: as the reason of a denied command, as
#                     context after a result, and in the machine notes of later runs
#          rewrite  — the command runs changed: `insert` goes after the first `after` words (one
#                     unless said), or on the end with `append = true`, unless the command
#                     already matches `unless`; `when = "console-running"` limits it to the time
#                     a console holds the binary; the rewrites compose, in the order written
#          allow    — the command runs as it is; the hit is only counted

[[gotcha]]
id = "shell-outside-allowlist"
where = "command"
pattern = '^\s*(cd|Set-Location|Start-Process|powershell(\.exe)?|pwsh|cmd(\.exe)?|sh|bash|python|pip|npm|node|sed|awk|perl)\b|^\s*git\s+-C\b'
message = "the shells here run cargo, the read-only git commands and the read-only listing and reading commands, from the workspace directory; read files with Read, change them with Edit (never sed), search with Grep and Glob, start from the files on the card, and pipe a long output through tail"
remedy = { kind = "hint" }

[[gotcha]]
id = "git-writes"
where = "command"
pattern = '(^|&&|\|\||;)\s*git\s+(stash|checkout|switch|restore|reset|clean|add|commit|rebase|merge|push|pull|cherry-pick|revert|branch\s+-[dD])\b'
message = "the git state is the person's: only the read-only git commands run here (status, diff, log, show); leave the working tree as you changed it and report, the person reviews and commits"
remedy = { kind = "hint" }

[[gotcha]]
id = "binary-locked"
where = "command"
pattern = '^\s*cargo\s+(build|test|clippy|check|run)\b'
message = "a console or a window holds its binary while it runs, so a workspace build cannot relink it; build and test the crates (-p) or exclude the binaries"
remedy = { kind = "rewrite", insert = "--workspace --exclude rc --exclude rc-gui", after = 2, unless = '(-p |--package |--exclude rc|--bin )', when = "console-running" }

# a port stuck in a message loop cannot be killed from a worker; the person does that, by pid
[[gotcha]]
id = "stuck-process"
where = "command"
pattern = '(^|&&|\|\||;|\|)\s*(Stop-Process|taskkill(\.exe)?|Get-CimInstance|Get-WmiObject)\b|\bWin32_Process\b'
message = "a process cannot be killed from here (Stop-Process, taskkill and Get-CimInstance are refused); hand it to the person: name the pid in the report"
remedy = { kind = "hint" }

# a refusal the worker talks about is a gotcha whether or not an entry above named it: the
# count and the journal see every one, and the report names the command so the catalogue grows
[[gotcha]]
id = "refused"
where = "text"
pattern = '(?i)\b(refused|refuses|denied|not permitted|not allowed|permission (was )?denied|blocked by the hook)\b'
message = "a refusal cost a turn: put the exact command and the refusal's words under a `refused:` line in the report, so the allowlist or the catalogue grows"
remedy = { kind = "hint" }

[[gotcha]]
id = "long-output"
where = "command"
pattern = '^\s*cargo\s+(test|build|clippy|check)\b'
message = "a cargo test, build or clippy prints more than a turn should carry, and every later turn carries it again; the tail is what matters, so the command runs with `2>&1 | tail -n 80` on its end"
remedy = { kind = "rewrite", insert = "2>&1 | tail -n 80", append = true, unless = '\|\s*\S|>\s*[^&\s]' }

[[gotcha]]
id = "binary-locked-result"
where = "result"
pattern = 'failed to remove file .*rc\.exe|Access is denied\. \(os error 5\)'
message = "the binary is held by a running console; run cargo with -p <crate> or --workspace --exclude rc"
remedy = { kind = "hint" }

[[gotcha]]
id = "powershell-not-allowed"
where = "result"
pattern = 'Command name is a dynamic expression|PowerShell.*not allowed|permission.*PowerShell'
message = "the PowerShell tool refused the command; the same cargo or git command runs through Bash"
remedy = { kind = "hint" }

[[gotcha]]
id = "mojibake"
where = "result"
pattern = 'â€[œ"˜™¦]|Ã©|Ã¼|Â·'
message = "the output is UTF-8 read as another code page; PowerShell 5.1 does this. Files are UTF-8 without BOM; read them with Read, not Get-Content"
remedy = { kind = "hint" }

[[gotcha]]
id = "not-logged-in"
where = "result"
pattern = 'Not logged in'
message = "the harness lost its login: never pass --bare on the subscription route, and run `claude /login` once"
remedy = { kind = "hint" }

[[gotcha]]
id = "edit-missed"
where = "edit"
pattern = '(?i)string to replace not found|old_string .*not found|not found in (the )?file|has not been read yet|has been modified since|found \d+ matches of the string|must be unique|no changes to make|is identical to'
message = "an edit missed: its old text was not current or not unique, and the turn went on nothing; Read the lines first, quote them exactly, whitespace included, and make each edit at one place"
remedy = { kind = "hint" }

[[gotcha]]
id = "misplaced-edit"
where = "text"
pattern = '(?i)\b(whoops|oops|misplaced|wrong (place|spot|location|file|line)|by mistake|accidentally|clobbered|redo (that|the|this) (edit|change)|undo (that|the|this) (edit|change)|that edit (landed|went) (wrong|in the wrong)|let me (fix|undo|revert) (that|my) (edit|change)|i (broke|overwrote|mangled|duplicated))\b'
message = "an edit landed wrong and cost turns to put right: read the exact region before editing, keep each edit to one place, and look at the file after a large one"
remedy = { kind = "hint" }

[[gotcha]]
id = "untested-claim"
where = "answer"
pattern = "(?i)couldn't run (any )?tests|could not run (the )?tests|unable to run (the )?tests|did not run the tests|tests? (were|was) not run"
message = "the worker reported the card done without running its tests; the acceptance check decides, not the report"
remedy = { kind = "hint" }
